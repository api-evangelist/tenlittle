aid: tenlittle
name: Ten Little
description: Ten Little is a direct-to-consumer children's footwear and essentials brand that designs healthy,
  non-toxic shoes for babies and kids. Its APMA-approved shoes use a proprietary TenForm Fit System — wide,
  foot-shaped toe boxes and flexible zero-drop soles grounded in medical and biomechanical research — to support
  natural movement and healthy foot development at every size and stage, and to accommodate AFO/SMO orthotics and
  braces. The brand sells online through a Shopify storefront and publishes no first-party developer API; the only
  API surfaces reachable on its domain are Shopify's platform-level Customer Account OIDC/OAuth and MCP endpoints.
